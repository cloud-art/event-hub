services:
  db:
    image: mysql:8.0
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: bx
      MYSQL_USER: bx
      MYSQL_PASSWORD: ${BX_DB_PASSWORD:?}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -ubx bx -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 35
  cms:
    build: {context: ., target: cms}
    ports:
      - "127.0.0.1:${BITRIX_PORT:-8182}:8080"
    volumes:
      - www:/www
      - ./local/modules/eventhub.content:/www/local/modules/eventhub.content:ro
      - ../../infra/source/events.json:/dist/events.json:ro
      - ./.local/business_encode.tar.gz:/dist/business_encode.tar.gz:ro
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/favicon.ico"]
      interval: 3s
      timeout: 3s
      retries: 35
  wizard:
    build: {context: ., target: wizard}
    profiles: [setup]
    environment:
      BX_DB_PASSWORD: ${BX_DB_PASSWORD:?}
      BX_ADMIN_PASSWORD: ${BX_ADMIN_PASSWORD:?}
volumes:
  db:
  www:
